<!-- UPDATE PRODUCT DETAILS -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Product - Apex Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand">
            <div class="brand-icon">📦</div>
            <span>Apex Inventory</span>
            <span class="brand-badge">MySQL Live</span>
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Dashboard</a>
            <a href="list.html" class="nav-link">Products</a>
            <a href="listOne.html" class="nav-link">Search</a>
            <a href="insert.html" class="nav-link">Add Product</a>
            <a href="update.html" class="nav-link active">Update</a>
            <a href="delete.html" class="nav-link">Delete</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card">
            <!-- Dedicated Photo for Update Page -->
            <div class="page-banner" style="background-image: url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1400&q=85');">
                <div class="banner-content">
                    <span class="banner-pill">Inventory Editor</span>
                    <h2>Update Product Details</h2>
                    <p>Load existing database values, modify fields, and synchronize changes in MySQL</p>
                </div>
            </div>

            <div class="card-body">
                <div id="alertBox" class="alert-toast"></div>

                <div style="background: rgba(10, 14, 23, 0.6); border: 1px dashed rgba(255, 255, 255, 0.15); border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 2rem;">
                    <label for="productSelect">Step 1: Select Product to Load</label>
                    <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem; flex-wrap: wrap;">
                        <select id="productSelect" onchange="onProductSelectChange(this.value)" style="flex: 1; min-width: 260px;">
                            <option value="">-- Choose a Product from Database --</option>
                        </select>
                        <button type="button" class="btn btn-secondary" onclick="loadProductDetails()">📥 Fetch Data</button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.75rem;">
                        <span style="font-size: 0.8rem; color: var(--text-muted);">Or enter ID manually:</span>
                        <input type="number" id="product_id" placeholder="e.g. 1 to 10" style="width: 120px; padding: 0.4rem 0.7rem; font-size: 0.85rem;" oninput="onManualIdInput(this.value)">
                    </div>
                </div>

                <form onsubmit="event.preventDefault(); updateProduct();">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="product_name">Product Name</label>
                            <input type="text" id="product_name" placeholder="Product name" required>
                        </div>

                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" required onchange="handleCategoryChange(this.value)">
                                <option value="" disabled selected>-- Select a Category --</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Monitors">Monitors</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Audio">Audio</option>
                                <option value="Peripherals">Peripherals</option>
                                <option value="Furniture">Furniture</option>
                                <option value="Storage">Storage</option>
                                <option value="Charging">Charging</option>
                                <option value="Streaming">Streaming</option>
                                <option value="Office">Office</option>
                                <option value="Hardware">Hardware</option>
                                <option value="__custom__">➕ Other / New Category...</option>
                            </select>
                            <input type="text" id="custom_category" placeholder="Enter custom category name" style="display: none; margin-top: 0.6rem;">
                        </div>

                        <div class="form-group">
                            <label for="price">Unit Price (₹)</label>
                            <input type="number" step="0.01" min="0" id="price" placeholder="Price" required>
                        </div>

                        <div class="form-group">
                            <label for="quantity">Quantity in Stock</label>
                            <input type="number" min="0" id="quantity" placeholder="Units in stock" required>
                        </div>

                        <div class="form-group">
                            <label for="reorder_level">Reorder Threshold</label>
                            <input type="number" min="0" id="reorder_level" placeholder="Reorder level" required>
                        </div>
                    </div>

                    <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                        <button type="submit" class="btn btn-primary">🔄 Update Record in MySQL</button>
                        <a href="list.html" class="btn btn-secondary">Back to Products</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Load all available products into dropdown
        loadProductOptions();

        function loadProductOptions() {
            fetch("/products")
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById("productSelect");
                    if (Array.isArray(data)) {
                        data.forEach(p => {
                            const opt = document.createElement("option");
                            opt.value = p.product_id;
                            opt.innerText = `#${p.product_id} - ${p.product_name} (${p.category})`;
                            select.appendChild(opt);
                        });

                        // Re-sync if query param exists
                        const queryId = new URLSearchParams(window.location.search).get('id');
                        if (queryId) {
                            select.value = queryId;
                        }
                    }
                })
                .catch(err => console.error("Error loading products:", err));
        }

        function onProductSelectChange(id) {
            if (id) {
                document.getElementById("product_id").value = id;
                loadProductDetails();
            }
        }

        function onManualIdInput(val) {
            const select = document.getElementById("productSelect");
            select.value = val || "";
        }

        function showAlert(msg, isError) {
            const el = document.getElementById("alertBox");
            el.className = `alert-toast ${isError ? 'alert-danger' : 'alert-success'}`;
            el.innerText = msg;
            el.style.display = 'block';
        }

        function handleCategoryChange(val) {
            const customInput = document.getElementById("custom_category");
            if (val === "__custom__") {
                customInput.style.display = "block";
                customInput.focus();
                customInput.required = true;
            } else {
                customInput.style.display = "none";
                customInput.required = false;
                customInput.value = "";
            }
        }

        function setCategoryValue(val) {
            const catSelect = document.getElementById("category");
            const customInput = document.getElementById("custom_category");
            let found = false;
            for (let i = 0; i < catSelect.options.length; i++) {
                if (catSelect.options[i].value.toLowerCase() === (val || '').toLowerCase()) {
                    catSelect.selectedIndex = i;
                    found = true;
                    break;
                }
            }
            if (!found && val) {
                const opt = document.createElement("option");
                opt.value = val;
                opt.innerText = val;
                catSelect.insertBefore(opt, catSelect.querySelector('option[value="__custom__"]'));
                catSelect.value = val;
                customInput.style.display = "none";
            } else if (!found) {
                catSelect.value = "";
                customInput.style.display = "none";
            } else {
                customInput.style.display = "none";
            }
        }

        // Auto load if URL has ?id=X
        const urlParams = new URLSearchParams(window.location.search);
        const queryId = urlParams.get('id');
        if (queryId) {
            document.getElementById("product_id").value = queryId;
            loadProductDetails();
        }

        function loadProductDetails() {
            const pid = document.getElementById("product_id").value.trim() || document.getElementById("productSelect").value;
            if (!pid) {
                showAlert("Please select or enter a Product ID first", true);
                return;
            }

            fetch("/products/" + pid)
                .then(res => {
                    if (!res.ok) throw new Error("Product with ID #" + pid + " not found in database");
                    return res.json();
                })
                .then(p => {
                    document.getElementById("product_id").value = p.product_id;
                    document.getElementById("productSelect").value = p.product_id;
                    document.getElementById("product_name").value = p.product_name;
                    setCategoryValue(p.category);
                    document.getElementById("price").value = p.price;
                    document.getElementById("quantity").value = p.quantity;
                    document.getElementById("reorder_level").value = p.reorder_level;
                    showAlert("Successfully loaded data for Product #" + pid + " (" + p.product_name + ")", false);
                })
                .catch(err => {
                    showAlert(err.message, true);
                });
        }

        function updateProduct() {
            const pid = document.getElementById("product_id").value.trim();
            if (!pid) {
                showAlert("Please specify which Product ID to update", true);
                return;
            }

            const product_name = document.getElementById("product_name").value.trim();
            const categorySelect = document.getElementById("category");
            let category = categorySelect.value;
            if (category === "__custom__") {
                category = document.getElementById("custom_category").value.trim();
            }

            if (!category) {
                showAlert("Please select or enter a category", true);
                return;
            }

            const price = document.getElementById("price").value;
            const quantity = document.getElementById("quantity").value;
            const reorder_level = document.getElementById("reorder_level").value;

            fetch("/products/" + pid, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    product_name,
                    category,
                    price: parseFloat(price),
                    quantity: parseInt(quantity),
                    reorder_level: parseInt(reorder_level)
                })
            })
            .then(res => {
                return res.json().then(data => {
                    if (!res.ok) throw new Error(data.message || data.error || "Update failed");
                    return data;
                });
            })
            .then(data => {
                showAlert("Success! " + (data.message || "Product updated successfully"), false);
                setTimeout(() => {
                    location.href = "list.html";
                }, 1200);
            })
            .catch(err => {
                showAlert(err.message, true);
            });
        }
    </script>
</body>
</html>
