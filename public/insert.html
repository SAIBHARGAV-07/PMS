<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Product - Apex Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand">
            <div class="brand-icon">📦</div>
            <span>Apex Inventory</span>
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Dashboard</a>
            <a href="list.html" class="nav-link">Products</a>
            <a href="listOne.html" class="nav-link">Search</a>
            <a href="insert.html" class="nav-link active">Add Product</a>
            <a href="update.html" class="nav-link">Update</a>
            <a href="delete.html" class="nav-link">Delete</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card">
            <!-- Dedicated Photo for Insert Page -->
            <div class="page-banner" style="background-image: url('https://images.unsplash.com/photo-1507925921958-8a62f3d1a50d?auto=format&fit=crop&w=1200&q=80');">
                <div class="banner-content">
                    <h2>Add New Product</h2>
                    <p>Register new merchandise, set stock quotas, pricing, and category</p>
                </div>
            </div>

            <div class="card-body">
                <div id="alertBox" class="alert-toast"></div>

                <form onsubmit="event.preventDefault(); saveProduct();">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="product_name">Product Name</label>
                            <input type="text" id="product_name" placeholder="e.g. Wireless Noise-Cancelling Headphones" required>
                        </div>

                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" required onchange="handleCategoryChange(this.value)">
                                <option value="" disabled selected>-- Select a Category --</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Monitors">Monitors</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Audio">Audio</option>
                                <option value="Peripherals">Peripherals</option>
                                <option value="Furniture">Furniture</option>
                                <option value="Storage">Storage</option>
                                <option value="Charging">Charging</option>
                                <option value="Streaming">Streaming</option>
                                <option value="Office">Office</option>
                                <option value="Hardware">Hardware</option>
                                <option value="__custom__">➕ Other / New Category...</option>
                            </select>
                            <input type="text" id="custom_category" placeholder="Enter custom category name" style="display: none; margin-top: 0.6rem;">
                        </div>

                        <div class="form-group">
                            <label for="price">Price (₹)</label>
                            <input type="number" step="0.01" min="0" id="price" placeholder="e.g. 149.99" required>
                        </div>

                        <div class="form-group">
                            <label for="quantity">Initial Stock Quantity</label>
                            <input type="number" min="0" id="quantity" placeholder="e.g. 50" required>
                        </div>

                        <div class="form-group">
                            <label for="reorder_level">Reorder Threshold Level</label>
                            <input type="number" min="0" id="reorder_level" placeholder="e.g. 10" required>
                        </div>
                    </div>

                    <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                        <button type="submit" class="btn btn-primary">💾 Save Product</button>
                        <a href="list.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function showAlert(msg, isError) {
            const el = document.getElementById("alertBox");
            el.className = `alert-toast ${isError ? 'alert-danger' : 'alert-success'}`;
            el.innerText = msg;
            el.style.display = 'block';
        }

        function handleCategoryChange(val) {
            const customInput = document.getElementById("custom_category");
            if (val === "__custom__") {
                customInput.style.display = "block";
                customInput.focus();
                customInput.required = true;
            } else {
                customInput.style.display = "none";
                customInput.required = false;
                customInput.value = "";
            }
        }

        function saveProduct() {
            const product_name = document.getElementById("product_name").value.trim();
            const categorySelect = document.getElementById("category");
            let category = categorySelect.value;
            
            if (category === "__custom__") {
                category = document.getElementById("custom_category").value.trim();
            }

            if (!category) {
                showAlert("Please select or enter a category", true);
                return;
            }

            const price = document.getElementById("price").value;
            const quantity = document.getElementById("quantity").value;
            const reorder_level = document.getElementById("reorder_level").value;

            fetch("/products", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    product_name,
                    category,
                    price: parseFloat(price),
                    quantity: parseInt(quantity),
                    reorder_level: parseInt(reorder_level)
                })
            })
            .then(res => {
                return res.json().then(data => {
                    if (!res.ok) throw new Error(data.message || data.error || "Failed to create product");
                    return data;
                });
            })
            .then(data => {
                showAlert("Success! " + (data.message || "Product added to database"), false);
                setTimeout(() => {
                    location.href = "list.html";
                }, 1200);
            })
            .catch(err => {
                showAlert(err.message, true);
            });
        }
    </script>
</body>
</html>
